
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | QR Attendance</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #0f172a;
            color: white;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .logout {
            background: #ef4444;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            max-width: 1000px;
            margin: 35px auto;
            padding: 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            color: #0f172a;
            margin-bottom: 8px;
        }

        .info-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            margin-bottom: 25px;
        }

        .info-card p {
            margin: 12px 0;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 15px;
        }

        .stat-card h1 {
            color: #2563eb;
            font-size: 32px;
            margin: 10px 0 0;
        }

        .history {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .empty {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h2>QR Attendance</h2>
    <a class="logout" th:href="@{/student-logout}">Logout</a>
</header>

<div class="container">

    <div class="welcome">
        <h1>
            Welcome,
            <span th:text="${student.studentName}">Student</span>!
        </h1>
        <p>View your attendance details and history below.</p>
    </div>

    <div class="info-card">
        <h2>Student Information</h2>

        <p>
            <strong>Name:</strong>
            <span th:text="${student.studentName}"></span>
        </p>

        <p>
            <strong>Roll Number:</strong>
            <span th:text="${student.rollNumber}"></span>
        </p>

        <p>
            <strong>Class:</strong>
            <span th:text="${student.className}"></span>
        </p>

        <p>
            <strong>Department:</strong>
            <span th:text="${student.department}"></span>
        </p>
    </div>

    <div class="stats">
        <div class="stat-card">
            <h3>Total Classes Attended</h3>
            <h1 th:text="${totalAttended}">0</h1>
        </div>
    </div>

    <div class="history">
        <h2>Attendance History</h2>

        <table>
            <thead>
            <tr>
                <th>S.No</th>
                <th>Session ID</th>
                <th>Date & Time</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="record, stat : ${attendanceList}">
                <td th:text="${stat.count}"></td>
                <td th:text="${record.sessionId}"></td>
                <td th:text="${#temporals.format(record.attendanceTime, 'dd-MM-yyyy HH:mm')}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(attendanceList)}">
                <td colspan="3" class="empty">
                    No attendance records found yet.
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>

<footer>
    QR Attendance System
</footer>

</body>
</html>
