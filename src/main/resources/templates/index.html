
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Attendance System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            background: white;
            color: #222;
            padding: 45px 35px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #203a43;
            margin-bottom: 15px;
            font-size: 30px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .login-btn {
            display: block;
            text-decoration: none;
            background: #203a43;
            color: white;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #2c5364;
            transform: scale(1.03);
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>QR Attendance System</h1>

        <p>
            Welcome to the QR-based Attendance Management System.
            Please select your login option to continue.
        </p>

        <a href="/teacher-login" class="login-btn">
            Teacher Login
        </a>

        <a href="/student-login" class="login-btn">
            Student Login
        </a>

        <a href="/admin-login" class="login-btn">
            Admin Login
        </a>

        <div class="footer">
            QR Attendance System
        </div>

    </div>

</body>
</html>
