
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mark Attendance</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
        }

        .info {
            text-align: center;
            color: #555;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
<div class="container">

    <h2>Mark Attendance</h2>

    <div class="info">
        <p>
            Class:
            <strong th:text="${className}">Class Name</strong>
        </p>

        <p>
            Subject:
            <strong th:text="${subject}">Subject</strong>
        </p>
    </div>

    <form id="attendanceForm"
          th:action="@{/mark-attendance}"
          method="post">

        <input type="hidden"
               name="sessionId"
               th:value="${sessionId}">

        <input type="hidden"
               name="token"
               th:value="${token}">

        <input type="hidden"
               id="deviceId"
               name="deviceId">

        <label for="rollNumber">Register Number</label>

        <input type="text"
               id="rollNumber"
               name="rollNumber"
               placeholder="Enter your register number"
               required>

        <button type="submit">Submit Attendance</button>

    </form>

</div>

<script>
    function getDeviceId() {
        let deviceId = localStorage.getItem("attendanceDeviceId");

        if (!deviceId) {
            if (window.crypto && window.crypto.randomUUID) {
                deviceId = window.crypto.randomUUID();
            } else {
                deviceId = "device-" +
                    Date.now() + "-" +
                    Math.random().toString(36).substring(2);
            }

            localStorage.setItem("attendanceDeviceId", deviceId);
        }

        return deviceId;
    }

    document.getElementById("deviceId").value = getDeviceId();
</script>

</body>
</html>
