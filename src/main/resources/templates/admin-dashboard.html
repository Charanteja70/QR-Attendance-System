<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard | QR Attendance</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e293b;
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;
            background: linear-gradient(180deg, #111827, #1e3a8a);
            color: white;
            padding: 25px 18px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
        }

        .menu {
            display: block;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            color: white;
            text-decoration: none;
        }

        .menu:hover {
            background: rgba(255,255,255,0.15);
        }

        .main {
            margin-left: 240px;
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            font-size: 30px;
        }

        .admin-badge {
            background: white;
            padding: 10px 18px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .card-title {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 32px;
            font-weight: bold;
        }

        .teacher-section {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.07);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .section-header h2 {
            font-size: 22px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            padding: 12px 18px;
            border-radius: 9px;
            text-decoration: none;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f5f9;
            text-align: left;
            padding: 15px;
            color: #475569;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        tr:hover {
            background: #f8fafc;
        }

        .status {
            background: #dcfce7;
            color: #15803d;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
            }

            .main {
                margin-left: 0;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="sidebar">

        <div class="logo">
            📋 QR ATTENDANCE
        </div>

        <a href="/admin-dashboard" class="menu">
            🏠 Dashboard
        </a>

        <a href="/add-teacher" class="menu">
            👨‍🏫 Teachers
        </a>

    </div>


    <div class="main">

        <div class="topbar">

            <div>
                <h1>Admin Dashboard</h1>
                <p style="color:#64748b; margin-top:6px;">
                    Manage your QR Attendance System
                </p>
            </div>

            <div class="admin-badge">
                👤 Administrator
            </div>

        </div>


        <div class="cards">

            <div class="card">
                <div class="card-title">
                    TOTAL TEACHERS
                </div>

                <div class="card-value"
                     th:text="${#lists.size(teachers)}">
                    0
                </div>
            </div>


            <div class="card">
                <div class="card-title">
                    SYSTEM STATUS
                </div>

                <div class="card-value"
                     style="font-size:22px; color:#16a34a;">
                    ● Online
                </div>
            </div>


            <div class="card">
                <div class="card-title">
                    QR ATTENDANCE
                </div>

                <div class="card-value"
                     style="font-size:22px;">
                    Active
                </div>
            </div>

        </div>


        <div class="teacher-section">

            <div class="section-header">

                <h2>👨‍🏫 Teacher Management</h2>

                <a href="/add-teacher" class="add-btn">
                    + Add New Teacher
                </a>

            </div>


            <table>

                <tr>
                    <th>Teacher ID</th>
                    <th>Teacher Name</th>
                    <th>Status</th>
                </tr>


                <tr th:each="teacher : ${teachers}">

                    <td th:text="${teacher.teacherId}">
                        1
                    </td>

                    <td th:text="${teacher.teacherName}">
                        Ram
                    </td>

                    <td>
                        <span class="status">
                            Active
                        </span>
                    </td>

                </tr>

            </table>

        </div>

    </div>

</body>

</html>
